<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Clippings — newsLookup Gen2</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:      #0d0f12; --bg2: #13161b; --bg3: #1a1e26;
    --border:  #2a2f3d; --accent: #4ade80; --accent2: #22d3ee;
    --warn:    #fbbf24; --text: #e2e8f0; --muted: #64748b; --danger: #f87171;
    --tag-bg:  #2a2008; --tag-border: #92400e; --tag-color: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans',sans-serif; font-size: 14px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  /* Header */
  header { border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 12px; background: var(--bg2); flex-shrink: 0; }
  .logo { font-family: 'IBM Plex Mono',monospace; font-size: 14px; font-weight: 600; color: var(--accent); }
  .logo span { color: var(--muted); font-weight: 400; }
  .total-badge { font-family: 'IBM Plex Mono',monospace; font-size: 11px; color: var(--muted); margin-left: auto; }

  /* Layout */
  .layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }

  /* Left panel — resizable */
  .left-panel {
    width: 320px; min-width: 200px; max-width: 600px;
    border-right: 1px solid var(--border);
    background: var(--bg2); display: flex; flex-direction: column;
    overflow: hidden; resize: horizontal;
  }
  .left-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

  /* Search box */
  .search-wrap { position: relative; }
  .search-input {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'IBM Plex Sans',sans-serif;
    font-size: 13px; padding: 10px 36px 10px 12px; outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent2); }
  .search-input::placeholder { color: var(--muted); }
  .search-go {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: var(--accent); border: none; border-radius: 5px;
    color: #0d0f12; font-size: 12px; padding: 3px 8px; cursor: pointer;
  }

  /* Filters */
  .filter-section { display: flex; flex-direction: column; gap: 6px; }
  .filter-label { font-family: 'IBM Plex Mono',monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .filter-select, .filter-input {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px; padding: 6px 10px;
    outline: none; font-family: 'IBM Plex Mono',monospace; cursor: pointer;
  }
  .filter-select:focus, .filter-input:focus { border-color: var(--accent2); }
  .filter-select option { background: var(--bg2); }

  /* Top N */
  .topn-row { display: flex; align-items: center; gap: 8px; }
  .topn-row label { font-family: 'IBM Plex Mono',monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .topn-select { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 5px 8px; outline: none; font-family: 'IBM Plex Mono',monospace; }

  /* Buttons */
  .btn { font-family: 'IBM Plex Mono',monospace; font-size: 11px; padding: 5px 12px; border-radius: 5px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; transition: all 0.15s; width: 100%; text-align: center; }
  .btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .divider { border: none; border-top: 1px solid var(--border); margin: 2px 0; }

  /* Right panel */
  .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .results-header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; background: var(--bg2); }
  .results-header span { font-family: 'IBM Plex Mono',monospace; font-size: 11px; color: var(--muted); }
  .results-header .mode-label { font-family: 'IBM Plex Mono',monospace; font-size: 11px; color: var(--accent2); }

  /* Sync toolbar */
  .sync-toolbar { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .year-select {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    border-radius: 5px; padding: 3px 8px; font-size: 11px;
    font-family: 'IBM Plex Mono',monospace; cursor: pointer; outline: none;
    transition: border-color 0.15s;
  }
  .year-select:focus { border-color: var(--accent2); }
  .year-select option { background: var(--bg2); }
  .sync-btn {
    font-family: 'IBM Plex Mono',monospace; font-size: 11px;
    padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border);
    background: none; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .export-btn { color: var(--accent2); border-color: var(--accent2); }
  .export-btn:hover { background: #0a1a22; }
  .import-btn { color: var(--accent); border-color: var(--accent); }
  .import-btn:hover { background: #0f2a1a; }
  .sync-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .results-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

  /* Collection card */
  .col-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; transition: border-color 0.15s; min-width: 0; }
  .col-card:hover { border-color: var(--accent2); }
  .col-card-header { padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .col-score { font-family: 'IBM Plex Mono',monospace; font-size: 12px; color: var(--accent2); min-width: 36px; text-align: right; flex-shrink: 0; padding-top: 2px; }
  .col-title { flex: 1; min-width: 0; }
  .col-title a { color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500; line-height: 1.5; word-break: break-word; }
  .col-title a:hover { color: var(--accent); text-decoration: underline; }
  .col-meta { padding: 0 14px 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .col-badge { font-family: 'IBM Plex Mono',monospace; font-size: 10px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); }
  .col-badge.source { border-color: var(--accent2); color: var(--accent2); }

  /* Tag badges on cards */
  .col-badge.tag {
    border-color: var(--tag-border); color: var(--tag-color);
    background: var(--tag-bg); cursor: default;
  }

  .col-summary { padding: 8px 14px 12px; font-size: 13px; color: var(--text); line-height: 1.6; border-top: 1px solid var(--border); display: none; }
  .col-summary.open { display: block; }
  .col-summary-point { display: flex; gap: 10px; padding: 5px 0; font-weight: 600; align-items: flex-start; }
  .col-summary-point::before { content: '▶'; font-size: 9px; color: var(--accent2); margin-top: 4px; flex-shrink: 0; }
  .col-actions { padding: 6px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
  .col-btn { font-family: 'IBM Plex Mono',monospace; font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .col-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .col-btn.del:hover { border-color: var(--danger); color: var(--danger); }
  .col-btn.tag-active { border-color: var(--tag-border); color: var(--tag-color); }

  /* Inline tag editor */
  .tag-editor {
    padding: 8px 14px 10px;
    border-top: 1px solid var(--border);
    background: var(--bg3);
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .tag-editor.open { display: flex; }
  .tag-editor-chips { display: flex; gap: 5px; flex-wrap: wrap; min-height: 22px; }
  .tag-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'IBM Plex Mono',monospace; font-size: 10px;
    padding: 2px 6px 2px 8px; border-radius: 10px;
    background: var(--tag-bg); border: 1px solid var(--tag-border); color: var(--tag-color);
  }
  .tag-chip-remove {
    background: none; border: none; color: var(--tag-color);
    cursor: pointer; font-size: 11px; padding: 0; line-height: 1;
    opacity: 0.7; transition: opacity 0.1s;
  }
  .tag-chip-remove:hover { opacity: 1; }
  .tag-editor-row { display: flex; gap: 6px; align-items: center; position: relative; }
  .tag-input {
    flex: 1; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 5px; color: var(--text); font-family: 'IBM Plex Mono',monospace;
    font-size: 11px; padding: 4px 8px; outline: none; transition: border-color 0.15s;
  }
  .tag-input:focus { border-color: var(--tag-border); }
  .tag-input::placeholder { color: var(--muted); }
  .tag-save-btn {
    font-family: 'IBM Plex Mono',monospace; font-size: 11px;
    padding: 4px 10px; border-radius: 4px; border: 1px solid var(--accent);
    background: none; color: var(--accent); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .tag-save-btn:hover { background: #0f2a1a; }
  .tag-save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Suggest tags button */
  .tag-suggest-btn {
    font-family: 'IBM Plex Mono',monospace; font-size: 11px;
    padding: 4px 10px; border-radius: 4px; border: 1px solid var(--accent2);
    background: none; color: var(--accent2); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .tag-suggest-btn:hover { background: #0a1a22; }
  .tag-suggest-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .tag-suggest-hint {
    font-family: 'IBM Plex Mono',monospace; font-size: 10px;
    color: var(--muted); padding: 2px 0;
  }

  /* Tag autocomplete dropdown */
  .tag-autocomplete {
    position: absolute; top: calc(100% + 3px); left: 0; right: 0;
    background: var(--bg2); border: 1px solid var(--tag-border);
    border-radius: 5px; z-index: 100; max-height: 140px; overflow-y: auto;
    display: none;
  }
  .tag-autocomplete.open { display: block; }
  .tag-ac-item {
    font-family: 'IBM Plex Mono',monospace; font-size: 11px;
    padding: 5px 10px; cursor: pointer; color: var(--tag-color);
    transition: background 0.1s;
  }
  .tag-ac-item:hover { background: var(--tag-bg); }

  /* ── Tag filter section in left panel ── */
  .tag-filter-chips { display: flex; gap: 5px; flex-wrap: wrap; min-height: 20px; }
  .tag-filter-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'IBM Plex Mono',monospace; font-size: 10px;
    padding: 2px 6px 2px 8px; border-radius: 10px;
    background: var(--tag-bg); border: 1px solid var(--tag-border); color: var(--tag-color);
  }
  .tag-filter-chip-remove {
    background: none; border: none; color: var(--tag-color);
    cursor: pointer; font-size: 11px; padding: 0; line-height: 1; opacity: 0.7;
  }
  .tag-filter-chip-remove:hover { opacity: 1; }
  .tag-mode-row { display: flex; gap: 5px; }
  .tag-mode-btn {
    font-family: 'IBM Plex Mono',monospace; font-size: 10px;
    padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border);
    background: none; color: var(--muted); cursor: pointer; transition: all 0.12s; flex: 1;
  }
  .tag-mode-btn.active {
    border-color: var(--tag-border); color: var(--tag-color); background: var(--tag-bg);
  }
  .tag-filter-input-wrap { position: relative; }
  .tag-filter-input {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 11px; padding: 5px 8px;
    outline: none; font-family: 'IBM Plex Mono',monospace; transition: border-color 0.15s;
  }
  .tag-filter-input:focus { border-color: var(--tag-border); }
  .tag-filter-input::placeholder { color: var(--muted); }
  .tag-filter-autocomplete {
    position: absolute; top: calc(100% + 3px); left: 0; right: 0;
    background: var(--bg2); border: 1px solid var(--tag-border);
    border-radius: 5px; z-index: 100; max-height: 130px; overflow-y: auto;
    display: none;
  }
  .tag-filter-autocomplete.open { display: block; }
  .tag-filter-ac-item {
    font-family: 'IBM Plex Mono',monospace; font-size: 11px;
    padding: 5px 10px; cursor: pointer; color: var(--tag-color); transition: background 0.1s;
  }
  .tag-filter-ac-item:hover { background: var(--tag-bg); }

  /* Similarity slider */
  .sim-bar { display: flex; align-items: center; gap: 8px; }
  .sim-bar label { font-family: 'IBM Plex Mono',monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .sim-bar input[type=range] { flex: 1; accent-color: var(--accent2); }
  .sim-val { font-family: 'IBM Plex Mono',monospace; font-size: 11px; color: var(--accent2); min-width: 32px; }

  .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); font-family: 'IBM Plex Mono',monospace; font-size: 12px; line-height: 2.5; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Left panel toggle (mobile) ── */
  .panel-toggle {
    display: none;
    background: none;
    border: 1px solid var(--border);
    color: var(--accent2);
    border-radius: 5px;
    padding: 4px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    body { overflow: auto; }
    .layout { flex-direction: column; overflow: visible; }
    header { padding: 10px 14px; }
    .logo { font-size: 12px; }
    .total-badge { font-size: 10px; }
    .panel-toggle { display: block; }
    .left-panel {
      width: 100%; min-width: unset; max-width: unset;
      resize: none; border-right: none;
      border-bottom: 1px solid var(--border);
      display: none;
    }
    .left-panel.open { display: flex; }
    .left-body { padding: 10px; }
    .right-panel { min-height: 400px; }
    .results-body { padding: 8px 10px; }
    .results-header { padding: 8px 12px; flex-wrap: wrap; gap: 6px; }
    .sync-toolbar { width: 100%; justify-content: flex-end; }
    .col-card-header { padding: 8px 10px; }
    .col-meta { padding: 0 10px 6px; }
    .col-actions { padding: 6px 10px; }
    .col-summary { padding: 6px 10px 10px; }
    .tag-editor { padding: 8px 10px 10px; }
    .search-input { font-size: 16px; }
    .filter-input { font-size: 16px; }
    .filter-select { font-size: 16px; }
  }

  @media (max-width: 430px) {
    .logo { font-size: 11px; }
    .col-title a { font-size: 12px; }
    .col-score { font-size: 11px; min-width: 28px; }
    .sync-btn { font-size: 10px; padding: 4px 8px; }
    .year-select { font-size: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">news<span style="color:#f87171">Lookup</span> Gen2 — <span>📚 My Clippings</span></div>
  <button class="panel-toggle" id="panelToggle" onclick="togglePanel()" title="Toggle filters">☰ Filters</button>
  <div class="total-badge" id="totalBadge">Loading...</div>
</header>

<div class="layout">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="left-body">

      <div class="filter-section">
        <div class="filter-label">🔍 AI Search</div>
        <div class="search-wrap">
          <input class="search-input" id="searchInput" placeholder="any news about US tech policy..."
            onkeydown="if(event.key==='Enter') doSearch()"/>
          <button class="search-go" onclick="doSearch()">▶</button>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-label">📅 Published Date</div>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="date" class="filter-input" id="dateFrom" oninput="loadAll()" style="flex:1;padding:5px 8px"/>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)">–</span>
          <input type="date" class="filter-input" id="dateTo" oninput="loadAll()" style="flex:1;padding:5px 8px"/>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-label">🌏 Region</div>
        <select class="filter-select" id="regionFilter" onchange="loadAll()">
          <option value="">All regions</option>
        </select>
      </div>

      <div class="filter-section">
        <div class="filter-label">📰 Source</div>
        <input class="filter-input" id="sourceFilter" placeholder="e.g. SCMP" oninput="loadAll()"/>
      </div>

      <!-- ── TAG FILTER ── -->
      <div class="filter-section">
        <div class="filter-label">🏷 Tags</div>

        <!-- ANY / ALL toggle -->
        <div class="tag-mode-row">
          <button class="tag-mode-btn active" id="tagModeAny" onclick="setTagMode('any')" title="Match items that have ANY of the selected tags">ANY</button>
          <button class="tag-mode-btn"        id="tagModeAll" onclick="setTagMode('all')" title="Match items that have ALL of the selected tags">ALL</button>
        </div>

        <!-- Active filter chips -->
        <div class="tag-filter-chips" id="tagFilterChips"></div>

        <!-- Input + autocomplete -->
        <div class="tag-filter-input-wrap">
          <input class="tag-filter-input" id="tagFilterInput"
            placeholder="Type tag, press Enter…"
            oninput="onTagFilterInput()"
            onkeydown="onTagFilterKeydown(event)"
            autocomplete="off"/>
          <div class="tag-filter-autocomplete" id="tagFilterAC"></div>
        </div>
      </div>
      <!-- ── END TAG FILTER ── -->

      <div class="topn-row">
        <label>Show top:</label>
        <select class="topn-select" id="topN">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>

      <div class="filter-section">
        <div class="sim-bar">
          <label>🎯 Min Match</label>
          <input type="range" id="simSlider" min="0" max="100" step="5" value="40"
            oninput="updateSim(this.value)"/>
          <span class="sim-val" id="simVal">40%</span>
        </div>
      </div>

      <hr class="divider"/>
      <button class="btn" onclick="loadAll()">🔄 Show All</button>
      <button class="btn danger" onclick="clearAll()">🗑 Clear All Clippings</button>

    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="results-header">
      <span id="resultsCount">—</span>
      <span class="mode-label" id="modeLabel"></span>
      <div class="sync-toolbar">
        <select id="exportYear" class="year-select" title="Filter by year"></select>
        <button class="sync-btn export-btn" onclick="exportCollection()" title="Export to JSON file">⬇ Export</button>
        <button class="sync-btn import-btn" onclick="document.getElementById('importFile').click()" title="Import from JSON file">⬆ Import</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importCollection(this)"/>
      </div>
    </div>
    <div id="importProgress" style="display:none;padding:6px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:4px" id="importProgressText">Importing…</div>
      <div style="background:var(--bg3);border-radius:3px;height:4px;overflow:hidden">
        <div id="importProgressBar" style="height:4px;background:var(--accent);border-radius:3px;width:0%;transition:width 0.3s;box-shadow:0 0 8px var(--accent)"></div>
      </div>
    </div>
    <div class="results-body" id="resultsBody">
      <div class="empty-state">Loading your collection...</div>
    </div>
  </div>

</div>

<script>
let allItems    = [];
let currentMode = 'all'; // 'all' or 'search'

// ── Similarity filter ────────────────────────────────────────────────────────
let minSimilarity = 40;

function updateSim(val) {
  minSimilarity = parseInt(val);
  document.getElementById('simVal').textContent = val + '%';
  if (currentMode === 'search') {
    const filtered = lastSearchResults.filter(i => (i.searchScore || 0) >= minSimilarity);
    renderItems(filtered, true);
  } else {
    renderItems(filterItems(allItems));
  }
}

let lastSearchResults = [];

// ── Tag filter state ─────────────────────────────────────────────────────────
let activeTagFilters = []; // array of lowercase tag strings
let tagFilterMode    = 'any'; // 'any' | 'all'

function setTagMode(mode) {
  tagFilterMode = mode;
  document.getElementById('tagModeAny').classList.toggle('active', mode === 'any');
  document.getElementById('tagModeAll').classList.toggle('active', mode === 'all');
  renderItems(filterItems(allItems));
}

function addTagFilter(tag) {
  const t = tag.trim().toLowerCase();
  if (!t || activeTagFilters.includes(t)) return;
  activeTagFilters.push(t);
  renderTagFilterChips();
  document.getElementById('tagFilterInput').value = '';
  closeTagFilterAC();
  renderItems(filterItems(allItems));
}

function removeTagFilter(tag) {
  activeTagFilters = activeTagFilters.filter(t => t !== tag);
  renderTagFilterChips();
  renderItems(filterItems(allItems));
}

function renderTagFilterChips() {
  const wrap = document.getElementById('tagFilterChips');
  wrap.innerHTML = activeTagFilters.map(t =>
    `<span class="tag-filter-chip">
      ${esc(t)}
      <button class="tag-filter-chip-remove" onclick="removeTagFilter('${esc(t)}')" title="Remove">✕</button>
    </span>`
  ).join('');
}

// ── Tag filter autocomplete ──────────────────────────────────────────────────
function getAllTagsFromItems() {
  const set = new Set();
  allItems.forEach(item => {
    if (item.tags) {
      item.tags.split(',').forEach(t => {
        const trimmed = t.trim().toLowerCase();
        if (trimmed) set.add(trimmed);
      });
    }
  });
  return [...set].sort();
}

function onTagFilterInput() {
  const val = document.getElementById('tagFilterInput').value.trim().toLowerCase();
  const all = getAllTagsFromItems();
  const matches = all.filter(t => t.includes(val) && !activeTagFilters.includes(t));

  const ac = document.getElementById('tagFilterAC');
  if (!val || !matches.length) { closeTagFilterAC(); return; }

  ac.innerHTML = matches.slice(0, 8).map(t =>
    `<div class="tag-filter-ac-item" onmousedown="addTagFilter('${esc(t)}')">${esc(t)}</div>`
  ).join('');
  ac.classList.add('open');
}

function onTagFilterKeydown(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = document.getElementById('tagFilterInput').value.trim();
    if (val) addTagFilter(val);
  }
  if (e.key === 'Escape') closeTagFilterAC();
}

function closeTagFilterAC() {
  document.getElementById('tagFilterAC').classList.remove('open');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.tag-filter-input-wrap')) closeTagFilterAC();
});

// ── Load all items ────────────────────────────────────────────────────────────
async function loadAll() {
  currentMode = 'all';
  document.getElementById('modeLabel').textContent = '';
  try {
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo   = document.getElementById('dateTo').value;
    const params   = new URLSearchParams();
    if (dateFrom) params.set('dateFrom', dateFrom);
    if (dateTo)   params.set('dateTo',   dateTo);
    const res   = await fetch('/api/collection?' + params.toString());
    const data  = await res.json();
    allItems = data.items || [];

    // populate region filter
    const regions = [...new Set(allItems.map(i => i.region).filter(Boolean))].sort();
    const rSel = document.getElementById('regionFilter');
    const cur  = rSel.value;
    rSel.innerHTML = '<option value="">All regions</option>' +
      regions.map(r => `<option value="${r}"${r===cur?' selected':''}>${r}</option>`).join('');

    populateYearFilter(allItems);
    renderItems(filterItems(allItems));
    updateTotal(allItems.length);
  } catch(err) {
    showError('Failed to load collection: ' + err.message);
  }
}

// ── Filter (extended with tag filter) ────────────────────────────────────────
function filterItems(items) {
  const region = document.getElementById('regionFilter').value;
  const source = document.getElementById('sourceFilter').value.toLowerCase().trim();
  const topN   = parseInt(document.getElementById('topN').value);

  return items.filter(item => {
    // region
    if (region && item.region !== region) return false;
    // source
    if (source && !item.source?.toLowerCase().includes(source)) return false;

    // ── tag filter ──
    if (activeTagFilters.length > 0) {
      // parse item's tags into a lowercase set
      const itemTags = item.tags
        ? item.tags.split(',').map(t => t.trim().toLowerCase()).filter(Boolean)
        : [];

      if (tagFilterMode === 'any') {
        // item must have at least one of the selected tags
        const hasAny = activeTagFilters.some(ft => itemTags.includes(ft));
        if (!hasAny) return false;
      } else {
        // 'all' — item must have every selected tag
        const hasAll = activeTagFilters.every(ft => itemTags.includes(ft));
        if (!hasAll) return false;
      }
    }

    return true;
  }).slice(0, topN);
}

// ── AI Search ─────────────────────────────────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { loadAll(); return; }

  currentMode = 'search';
  document.getElementById('modeLabel').textContent = '🤖 AI search: "' + q + '"';
  document.getElementById('resultsCount').textContent = '⏳ Searching...';
  document.getElementById('resultsBody').innerHTML =
    '<div class="empty-state">⏳ Computing similarity scores...</div>';

  try {
    const topN = parseInt(document.getElementById('topN').value);
    const res  = await fetch('/api/collection/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q, topN }),
    });
    const data = await res.json();
    if (data.error) { showError(data.error); return; }
    lastSearchResults = data.items;
    const simFiltered = data.items.filter(i => (i.searchScore || 0) >= minSimilarity);
    renderItems(simFiltered, true);
    document.getElementById('resultsCount').textContent =
      `${simFiltered.length} result${simFiltered.length !== 1 ? 's' : ''} (min ${minSimilarity}% match)`;
  } catch(err) {
    showError('Search failed: ' + err.message);
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderItems(items, isSearch = false) {
  const body = document.getElementById('resultsBody');
  document.getElementById('resultsCount').textContent =
    `${items.length} item${items.length !== 1 ? 's' : ''}`;

  if (!items.length) {
    body.innerHTML = '<div class="empty-state">📭 No items found.<br><br>' +
      (currentMode === 'search' ? 'Try a different query or lower your search terms.' :
       'Save articles from the main search using the 🤖 Summarise button.') + '</div>';
    return;
  }

  body.innerHTML = items.map((item) => {
    const scoreLabel = isSearch && item.searchScore
      ? `<span class="col-score" title="Similarity to your query">${item.searchScore}% match</span>`
      : '';
    const savedDate  = item.savedAt ? new Date(item.savedAt).toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false
    }) : '';
    const pubDate    = item.pubDate ? fmtDate(item.pubDate) : '';
    const hasSummary = item.summary && item.summary.trim().length > 0;

    // tag badges for display in meta row
    const tagBadges = item.tags
      ? item.tags.split(',').map(t => t.trim()).filter(Boolean)
          .map(t => `<span class="col-badge tag">🏷 ${esc(t)}</span>`).join('')
      : '';

    // existing tags as chips for the inline editor (pre-populated)
    const editorChipsHtml = buildEditorChipsHtml(item.id, item.tags || '');

    return `<div class="col-card" id="card_${item.id}">
      <div class="col-card-header">
        ${scoreLabel}
        <div class="col-title" style="flex:1">
          <a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a>
        </div>
      </div>
      <div class="col-meta" id="meta_${item.id}">
        <span class="col-badge source">${esc(item.source||'')}</span>
        <span class="col-badge">${esc(item.region||'')}</span>
        ${pubDate ? `<span class="col-badge">${pubDate}</span>` : ''}
        <span class="col-badge">saved ${savedDate}</span>
        ${tagBadges}
      </div>
      ${hasSummary ? `<div class="col-summary" id="summary_${item.id}">${parseSummary(item.summary).map(s=>`<div class="col-summary-point">${esc(s)}</div>`).join('')}</div>` : ''}
      <div class="col-actions">
        ${hasSummary
          ? `<button class="col-btn" onclick="toggleSummary(${item.id})">📝 Summary</button>`
          : `<button class="col-btn" id="sum_${item.id}" onclick="summariseClipping(${item.id},'${esc(item.url)}','${esc(item.title).replace(/'/g,"\\'")}')">🤖 Summarise</button>`}
        <button class="col-btn${item.tags ? ' tag-active' : ''}" id="tagBtn_${item.id}" onclick="toggleTagEditor(${item.id})">🏷 Tags</button>
        <button class="col-btn del" onclick="deleteItem(${item.id})">✕ Remove</button>
      </div>
      <div class="tag-editor" id="tagEditor_${item.id}">
        <div class="tag-editor-chips" id="editorChips_${item.id}">${editorChipsHtml}</div>
        <button class="tag-suggest-btn" id="tagSuggestBtn_${item.id}" onclick="suggestTags(${item.id})">✨ Suggest Tags</button>
        <div class="tag-suggest-hint" id="tagSuggestHint_${item.id}" style="display:none"></div>
        <div class="tag-editor-row">
          <input class="tag-input" id="tagInput_${item.id}"
            placeholder="Add tag, press Enter or comma…"
            oninput="onTagEditorInput(${item.id})"
            onkeydown="onTagEditorKeydown(event,${item.id})"
            autocomplete="off"/>
          <button class="tag-save-btn" id="tagSaveBtn_${item.id}" onclick="saveTags(${item.id})">💾 Save</button>
          <div class="tag-autocomplete" id="tagAC_${item.id}"></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Tag editor helpers ────────────────────────────────────────────────────────

// In-memory draft tags per card (itemId → string[])
const draftTags = {};

function buildEditorChipsHtml(itemId, tagsStr) {
  // initialise draft from current DB value
  const tags = tagsStr
    ? tagsStr.split(',').map(t => t.trim()).filter(Boolean)
    : [];
  draftTags[itemId] = [...tags]; // seed draft
  return tags.map(t => chipHtml(itemId, t)).join('');
}

function chipHtml(itemId, tag) {
  return `<span class="tag-chip" id="chip_${itemId}_${esc(tag)}">
    ${esc(tag)}
    <button class="tag-chip-remove" onclick="removeDraftTag(${itemId},'${esc(tag)}')" title="Remove tag">✕</button>
  </span>`;
}

function toggleTagEditor(itemId) {
  const editor = document.getElementById(`tagEditor_${itemId}`);
  const btn    = document.getElementById(`tagBtn_${itemId}`);
  const isOpen = editor.classList.toggle('open');
  btn.classList.toggle('tag-active', isOpen);
  if (isOpen) {
    setTimeout(() => document.getElementById(`tagInput_${itemId}`)?.focus(), 50);
  }
}

function removeDraftTag(itemId, tag) {
  if (!draftTags[itemId]) return;
  draftTags[itemId] = draftTags[itemId].filter(t => t !== tag);
  reRenderEditorChips(itemId);
}

function reRenderEditorChips(itemId) {
  const wrap = document.getElementById(`editorChips_${itemId}`);
  if (wrap) wrap.innerHTML = (draftTags[itemId] || []).map(t => chipHtml(itemId, t)).join('');
}

function addDraftTag(itemId, tag) {
  const t = tag.trim();
  if (!t) return;
  if (!draftTags[itemId]) draftTags[itemId] = [];
  if (!draftTags[itemId].includes(t)) {
    draftTags[itemId].push(t);
    reRenderEditorChips(itemId);
  }
  const inp = document.getElementById(`tagInput_${itemId}`);
  if (inp) inp.value = '';
  closeTagAC(itemId);
}

function onTagEditorKeydown(e, itemId) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = document.getElementById(`tagInput_${itemId}`)?.value.trim();
    if (val) addDraftTag(itemId, val);
  }
  if (e.key === 'Escape') closeTagAC(itemId);
}

function onTagEditorInput(itemId) {
  const val     = document.getElementById(`tagInput_${itemId}`)?.value.trim().toLowerCase();
  const allTags = getAllTagsFromItems();
  const current = draftTags[itemId] || [];
  const matches = allTags.filter(t =>
    val && t.toLowerCase().includes(val) && !current.map(c => c.toLowerCase()).includes(t)
  );

  const ac = document.getElementById(`tagAC_${itemId}`);
  if (!ac) return;
  if (!val || !matches.length) { closeTagAC(itemId); return; }

  ac.innerHTML = matches.slice(0, 6).map(t =>
    `<div class="tag-ac-item" onmousedown="addDraftTag(${itemId},'${esc(t)}')">${esc(t)}</div>`
  ).join('');
  ac.classList.add('open');
}

function closeTagAC(itemId) {
  document.getElementById(`tagAC_${itemId}`)?.classList.remove('open');
}

// ── AI Tag Suggestion ─────────────────────────────────────────────────────────
async function suggestTags(itemId) {
  const btn    = document.getElementById(`tagSuggestBtn_${itemId}`);
  const hintEl = document.getElementById(`tagSuggestHint_${itemId}`);

  const item = allItems.find(i => i.id === itemId);
  if (!item) return;

  btn.disabled    = true;
  btn.textContent = '⏳ Thinking…';
  hintEl.style.display = 'none';

  const existingTags = (draftTags[itemId] || []).join(', ');

  try {
    const res = await fetch('/api/collection/suggest-tags', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title:        item.title,
        summary:      item.summary  || '',
        source:       item.source   || '',
        region:       item.region   || '',
        existingTags: existingTags,
      }),
    });

    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Server error');

    const suggestions = data.suggestions || [];

    // filter out tags already in draft (safety check)
    const current  = (draftTags[itemId] || []).map(t => t.toLowerCase());
    const filtered = suggestions.filter(s => !current.includes(s.tag.toLowerCase()));

    if (!filtered.length) {
      hintEl.textContent   = '✓ No new tags to suggest (all relevant tags already present or below 85% confidence)';
      hintEl.style.display = 'block';
      btn.disabled    = false;
      btn.textContent = '✨ Suggest Tags';
      return;
    }

    // add as draft chips
    filtered.forEach(s => {
      if (!draftTags[itemId]) draftTags[itemId] = [];
      if (!draftTags[itemId].includes(s.tag)) draftTags[itemId].push(s.tag);
    });
    reRenderEditorChips(itemId);

    hintEl.textContent   = `✨ Added ${filtered.length} tag${filtered.length !== 1 ? 's' : ''}: ${filtered.map(s => s.tag + ' (' + s.score + '%)').join(', ')} — click 💾 Save to apply`;
    hintEl.style.display = 'block';

    btn.disabled    = false;
    btn.textContent = '✨ Suggest Tags';

  } catch (err) {
    hintEl.textContent   = '❌ Suggestion failed: ' + err.message;
    hintEl.style.display = 'block';
    btn.disabled    = false;
    btn.textContent = '✨ Suggest Tags';
    console.error('suggestTags error:', err);
  }
}

// ── Save tags to server ───────────────────────────────────────────────────────
async function saveTags(itemId) {
  const btn      = document.getElementById(`tagSaveBtn_${itemId}`);
  const tags     = (draftTags[itemId] || []).join(', ');

  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }

  try {
    const res = await fetch(`/api/collection/${itemId}/tags`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ tags }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Save failed');

    // update allItems in memory
    const idx = allItems.findIndex(i => i.id === itemId);
    if (idx !== -1) allItems[idx].tags = data.tags || '';

    // refresh meta row tag badges
    refreshMetaTags(itemId, data.tags || '');

    // update Tags button styling
    const tagBtn = document.getElementById(`tagBtn_${itemId}`);
    if (tagBtn) tagBtn.classList.toggle('tag-active', !!(data.tags));

    if (btn) { btn.textContent = '✅ Saved'; btn.disabled = false; }
    setTimeout(() => {
      if (btn) btn.textContent = '💾 Save';
      // close editor after save
      const editor = document.getElementById(`tagEditor_${itemId}`);
      if (editor) editor.classList.remove('open');
    }, 1000);

  } catch(err) {
    if (btn) { btn.textContent = '❌ Error'; btn.disabled = false; }
    setTimeout(() => { if (btn) btn.textContent = '💾 Save'; }, 2000);
    console.error('Tag save error:', err.message);
  }
}

// Refresh only the tag badges in the meta row — no full re-render
function refreshMetaTags(itemId, tagsStr) {
  const meta = document.getElementById(`meta_${itemId}`);
  if (!meta) return;

  // remove existing tag badges
  meta.querySelectorAll('.col-badge.tag').forEach(el => el.remove());

  // append new ones
  if (tagsStr) {
    tagsStr.split(',').map(t => t.trim()).filter(Boolean).forEach(t => {
      const span = document.createElement('span');
      span.className = 'col-badge tag';
      span.textContent = '🏷 ' + t;
      meta.appendChild(span);
    });
  }
}

function toggleSummary(id) {
  const el = document.getElementById('summary_' + id);

}

async function deleteItem(id) {
  if (!confirm('Remove this item from your collection?')) return;
  try {
    await fetch('/api/collection/' + id, { method: 'DELETE' });
    document.getElementById('card_' + id)?.remove();
    allItems = allItems.filter(i => i.id !== id);
    delete draftTags[id];
    updateTotal(allItems.length);
    document.getElementById('resultsCount').textContent =
      document.querySelectorAll('.col-card').length + ' items';
  } catch(err) { alert('Delete failed: ' + err.message); }
}

async function clearAll() {
  if (!confirm('Clear your ENTIRE collection?\n\nThis cannot be undone.')) return;
  try {
    await fetch('/api/collection', { method: 'DELETE' });
    allItems = [];
    renderItems([]);
    updateTotal(0);
  } catch(err) { alert('Failed: ' + err.message); }
}

function updateTotal(n) {
  document.getElementById('totalBadge').textContent = n + ' item' + (n !== 1 ? 's' : '') + ' saved';
}

function showError(msg) {
  document.getElementById('resultsBody').innerHTML =
    `<div class="empty-state" style="color:var(--danger)">❌ ${esc(msg)}</div>`;
}

function fmtDate(raw) {
  if (!raw) return '';
  const d = new Date(raw);
  if (isNaN(d)) return String(raw).slice(0, 16); // show raw string if unparseable
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function parseSummary(raw) {
  // Strip <think>...</think> blocks (qwen3 reasoning traces)
  let clean = raw.replace(/<think>[\s\S]*?<\/think>/gi, '');
  // If content uses ▶/•/► as inline separators (not newlines), normalise to newlines first
  if (/[▶▸►•]/.test(clean) && clean.split(/\r?\n/).length <= 2) {
    clean = clean.replace(/[▶▸►•]/g, '\n');
  }
  const results = [];
  for (const line of clean.split(/\r?\n/)) {
    // Strip leading bullet chars: ▶ ▸ ► • - * or numbered 1. 2) etc, plus invisible chars
    const stripped = line.replace(/^[\s\u200b\u00a0]*([▶▸►•\-\*]|\d+[\.\)])\s*/, '').trim();
    const text = stripped || line.trim();
    // Must have actual visible content (at least 3 real chars)
    if (text.replace(/[\s\u200b\u00a0\r]/g, '').length >= 3) {
      results.push(text);
    }
  }
  return results;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Summarise from Clippings ──────────────────────────────────────────────────
async function summariseClipping(id, url, title) {
  const btn = document.getElementById('sum_' + id);
  if (!btn) return;
  btn.textContent = '⏳';
  btn.disabled = true;

  try {
    const res  = await fetch('/api/summarise', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, link: url }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    // save summary back to DB
    await fetch('/api/collection/summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, summary: data.summary }),
    });

    btn.textContent = '✅';
    btn.title = 'Summary saved! Reload to view.';
    // show summary inline
    const card = document.getElementById('card_' + id);
    if (card) {
      const fmtSummary = s => parseSummary(s).map(p=>`<div class="col-summary-point">${esc(p)}</div>`).join('');
      const existing = card.querySelector('.col-summary');
      if (existing) {
        existing.innerHTML = fmtSummary(data.summary);
        existing.classList.add('open');
      } else {
        const div = document.createElement('div');
        div.className = 'col-summary open';
        div.innerHTML = fmtSummary(data.summary);
        card.querySelector('.col-actions').before(div);
      }
    }
  } catch(err) {
    btn.textContent = '❌';
    btn.title = 'Error: ' + err.message;
    btn.disabled = false;
  }
}

function togglePanel() {
  const panel = document.querySelector('.left-panel');
  const btn   = document.getElementById('panelToggle');
  const open  = panel.classList.toggle('open');

// ── Export ────────────────────────────────────────────────────────────────────
function populateYearFilter(items) {
  const years = [...new Set(items
    .map(i => i.savedAt ? new Date(i.savedAt).getFullYear() : null)
    .filter(Boolean)
  )].sort((a, b) => b - a);

  const sel = document.getElementById('exportYear');
  sel.innerHTML = '<option value="">All Years</option>' +
    years.map(y => `<option value="${y}">${y}</option>`).join('');
}

async function exportCollection() {
  const year = document.getElementById('exportYear').value;
  const btn  = document.querySelector('.export-btn');
  btn.disabled = true;
  btn.textContent = '⏳';

  try {
    const res  = await fetch('/api/collection');
    const data = await res.json();
    let items  = data.items || data;

    if (year) {
      items = items.filter(i => i.savedAt && new Date(i.savedAt).getFullYear() === parseInt(year));
    }

    const filename = year ? `collection-${year}.json` : `collection-all.json`;

    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);

    btn.textContent = `✅ ${items.length} exported`;
    setTimeout(() => { btn.textContent = '⬇ Export'; btn.disabled = false; }, 2500);
  } catch(err) {
    btn.textContent = '❌ Error';
    btn.disabled = false;
    setTimeout(() => { btn.textContent = '⬇ Export'; }, 2000);
  }
}

// ── Import ────────────────────────────────────────────────────────────────────
async function importCollection(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  const importBtn  = document.querySelector('.import-btn');
  const progressEl = document.getElementById('importProgress');
  const barEl      = document.getElementById('importProgressBar');
  const textEl     = document.getElementById('importProgressText');

  let items;
  try {
    const text = await file.text();
    items = JSON.parse(text);
    if (!Array.isArray(items)) throw new Error('Invalid format');
  } catch(err) {
    alert('❌ Could not read file: ' + err.message);
    return;
  }

  let existingUrls = new Set();
  try {
    const res  = await fetch('/api/collection');
    const data = await res.json();
    (data.items || data).forEach(i => existingUrls.add(i.url));
  } catch(err) {
    alert('❌ Could not load existing collection: ' + err.message);
    return;
  }

  const toImport = items.filter(i => i.url && !existingUrls.has(i.url));
  const skipped  = items.length - toImport.length;

  if (toImport.length === 0) {
    alert(`ℹ️ Nothing to import.\n\n${skipped} item${skipped !== 1 ? 's' : ''} already exist in your collection.`);
    return;
  }

  importBtn.disabled = true;
  progressEl.style.display = 'block';
  barEl.style.width = '0%';
  barEl.style.background = 'var(--accent)';

  let imported = 0;
  let failed   = 0;
  const importedItems = [];

  for (let i = 0; i < toImport.length; i++) {
    const item = toImport[i];
    const pct  = Math.round(((i + 1) / toImport.length) * 50);
    barEl.style.width = pct + '%';
    textEl.textContent = `Importing… ${i + 1} / ${toImport.length}`;

    try {
      const res = await fetch('/api/collection', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          newsId:    item.newsId    || undefined,
          url:       item.url,
          title:     item.title,
          summary:   item.summary   || '',
          score:     item.score     ?? null,
          threshold: item.threshold ?? null,
          source:    item.source    || '',
          region:    item.region    || '',
          pubDate:   item.pubDate   || '',
          tags:      item.tags      || null,
        }),
      });
      if (!res.ok) throw new Error();
      imported++;
      importedItems.push(item);
    } catch {
      failed++;
    }
  }

  loadAll();

  if (imported === 0) {
    progressEl.style.display = 'none';
    importBtn.disabled = false;
    alert(`❌ Import failed — ${failed} item${failed !== 1 ? 's' : ''} could not be saved.`);
    return;
  }

  textEl.textContent   = `✅ ${imported} imported — building search index…`;
  barEl.style.width    = '50%';
  barEl.style.background = 'var(--accent2)';

  await reEmbedItems(importedItems);

  importBtn.disabled = false;

  if (skipped || failed) {
    alert([
      skipped ? `• ${skipped} skipped (already exist)` : null,
      failed  ? `• ${failed} failed to save` : null,
    ].filter(Boolean).join('\n'));
  }
}

// ── Check & fix missing vectors on load ───────────────────────────────────────
async function checkUnembedded() {
  try {
    const res  = await fetch('/api/collection/unembedded');
    if (!res.ok) return;
    const data = await res.json();
    const items = data.items || [];
    if (items.length === 0) return;

    const yes = confirm(`⚠️ ${items.length} item${items.length !== 1 ? 's are' : ' is'} missing search vectors.\n\nRe-create now?`);
    if (!yes) return;

    await reEmbedItems(items);
  } catch {
    // silent
  }
}

async function reEmbedItems(items) {
  const progressEl = document.getElementById('importProgress');
  const barEl      = document.getElementById('importProgressBar');
  const textEl     = document.getElementById('importProgressText');

  progressEl.style.display = 'block';
  barEl.style.background   = 'var(--accent2)';
  barEl.style.width        = '0%';

  let embedded   = 0;
  let embedFailed = 0;

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const pct  = Math.round(((i + 1) / items.length) * 100);
    barEl.style.width  = pct + '%';
    textEl.textContent = `Re-embedding ${i + 1} / ${items.length}…`;

    try {
      const res = await fetch('/api/collection/embed', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newsId: item.newsId, title: item.title, url: item.url }),
      });
      if (!res.ok) throw new Error();
      embedded++;
    } catch {
      embedFailed++;
    }
  }

  setTimeout(() => {
    progressEl.style.display = 'none';
    barEl.style.width = '0%';
    const msg = [
      `✅ ${embedded} item${embedded !== 1 ? 's' : ''} ready for semantic search`,
      embedFailed ? `• ${embedFailed} failed — try again later` : null,
    ].filter(Boolean).join('\n');
    alert(msg);
  }, 400);
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function setDefaultDateRange() {
  const fmt = d => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  };
  const today = new Date();
  const from  = new Date();
  from.setDate(today.getDate() - 14);
  document.getElementById('dateFrom').value = fmt(from);
  document.getElementById('dateTo').value   = fmt(today);
})();
loadAll();
checkUnembedded();
</script>
