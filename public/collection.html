<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>newsLookup — My Clippings</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="common/common.css"/>
<link rel="stylesheet" href="css/collection.css"/>
</head>
<body>

<header>
  <div class="logo">news<span style="color:#f87171">Lookup</span> Gen2 — <span>📚 My Clippings</span></div>
  <button class="panel-toggle" id="panelToggle" onclick="togglePanel()" title="Toggle filters">☰ Filters</button>
  <div class="total-badge" id="totalBadge">Loading...</div>
</header>

<div class="layout">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="left-body">

      <div class="filter-section">
        <div class="filter-label">🔍 AI Search</div>
        <div class="search-wrap">
          <input class="search-input" id="searchInput" placeholder="any news about US tech policy..."
            onkeydown="if(event.key==='Enter') doSearch()"/>
          <button class="search-go" onclick="doSearch()">▶</button>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-label">📅 Published Date</div>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="date" class="filter-input" id="dateFrom" oninput="loadAll()" style="flex:1;padding:5px 8px"/>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)">–</span>
          <input type="date" class="filter-input" id="dateTo" oninput="loadAll()" style="flex:1;padding:5px 8px"/>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-label">🌏 Region</div>
        <select class="filter-select" id="regionFilter" onchange="loadAll()">
          <option value="">All regions</option>
        </select>
      </div>

      <div class="filter-section">
        <div class="filter-label">📰 Source</div>
        <input class="filter-input" id="sourceFilter" placeholder="e.g. SCMP" oninput="loadAll()"/>
      </div>

      <!-- Tag Filter -->
      <div class="filter-section">
        <div class="filter-label">🏷 Tags</div>
        <div class="tag-mode-row">
          <button class="tag-mode-btn active" id="tagModeAny" onclick="setTagMode('any')" title="Match items that have ANY of the selected tags">ANY</button>
          <button class="tag-mode-btn"        id="tagModeAll" onclick="setTagMode('all')" title="Match items that have ALL of the selected tags">ALL</button>
        </div>
        <div class="tag-filter-chips" id="tagFilterChips"></div>
        <div class="tag-filter-input-wrap">
          <input class="tag-filter-input" id="tagFilterInput"
            placeholder="Type tag, press Enter…"
            oninput="onTagFilterInput()"
            onkeydown="onTagFilterKeydown(event)"
            autocomplete="off"/>
          <div class="tag-filter-autocomplete" id="tagFilterAC"></div>
        </div>
      </div>

      <div class="topn-row">
        <label>Show top:</label>
        <select class="topn-select" id="topN">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>

      <div class="filter-section">
        <div class="sim-bar">
          <label>🎯 Min Match</label>
          <input type="range" id="simSlider" min="0" max="100" step="5" value="40"
            oninput="updateSim(this.value)"/>
          <span class="sim-val" id="simVal">40%</span>
        </div>
      </div>

      <hr class="divider"/>
      <button class="btn" onclick="loadAll()">🔄 Show All</button>
      <button class="btn danger" onclick="clearAll()">🗑 Clear All Clippings</button>

    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="results-header">
      <span id="resultsCount">—</span>
      <span class="mode-label" id="modeLabel"></span>
      <div class="sync-toolbar">
        <select id="exportYear" class="year-select" title="Filter by year"></select>
        <button class="sync-btn export-btn" onclick="exportCollection()" title="Export to JSON file">⬇ Export</button>
        <button class="sync-btn import-btn" onclick="document.getElementById('importFile').click()" title="Import from JSON file">⬆ Import</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importCollection(this)"/>
      </div>
    </div>
    <div id="importProgress" style="display:none;padding:6px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:4px" id="importProgressText">Importing…</div>
      <div style="background:var(--bg3);border-radius:3px;height:4px;overflow:hidden">
        <div id="importProgressBar" style="height:4px;background:var(--accent);border-radius:3px;width:0%;transition:width 0.3s;box-shadow:0 0 8px var(--accent)"></div>
      </div>
    </div>
    <div class="results-body" id="resultsBody">
      <div class="empty-state">Loading your collection...</div>
    </div>
  </div>

</div>

<script src="common/common.js"></script>
<script src="js/collection.js"></script>
</body>
</html>
