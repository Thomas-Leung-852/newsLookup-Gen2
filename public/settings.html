<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>newsLookup — Settings</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="common/common.css"/>
<link rel="stylesheet" href="css/settings.css"/>
</head>
<body>

<nav class="topbar">
  <a href="/" class="topbar-brand">newsLookup</a>
  <span class="topbar-sep">/</span>
  <span class="topbar-title">settings</span>
  <div class="topbar-nav">
    <a href="/">Search</a>
    <a href="/collection">Collection</a>
  </div>
</nav>

<main class="main">

  <div class="page-header">
    <h1>App Settings</h1>
    <p>Runtime configuration — all values are stored in
      <code style="font-family:var(--mono);font-size:11px;color:var(--accent)">config/app-settings.json</code>
      and take effect immediately.
    </p>
  </div>

  <div id="statusBar" class="status-bar">
    <span class="dot"></span>
    <span id="statusMsg"></span>
  </div>

  <div id="settingsContainer">
    <!-- Loading skeleton -->
    <div class="domain-card">
      <div class="domain-header">
        <div class="skeleton" style="width:28px;height:28px;border-radius:5px;flex-shrink:0"></div>
        <div style="flex:1"><div class="skeleton" style="width:120px"></div></div>
      </div>
    </div>
  </div>

  <div class="footer-actions">
    <button class="btn btn-ghost"   onclick="loadAll()">↺ Reload</button>
    <button class="btn btn-danger"  onclick="confirmReset()">Reset all to defaults</button>
    <span class="last-updated" id="lastUpdated"></span>
  </div>

</main>

<script src="common/common.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
