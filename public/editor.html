<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>newsLookup — RSS Site Editor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="common/common.css"/>
<link rel="stylesheet" href="css/editor.css"/>
</head>
<body>

<header>
  <div class="logo">news<span>Lookup</span> Gen2 — RSS Site Editor</div>
  <button class="panel-toggle" id="panelToggle" onclick="togglePanel()" title="Toggle site list">☰ Sites</button>
  <div class="site-count" id="siteCount">Loading...</div>
</header>

<div class="layout">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="left-toolbar">
      <div class="btn-row">
        <button class="btn primary" onclick="newSite()">＋ New Site</button>
        <button class="btn danger"  onclick="deleteSite()" id="btnDelete" disabled>✕ Delete</button>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="findDuplicates()" style="flex:1;border-color:var(--warn);color:var(--warn)">🔍 Find Duplicated Feed</button>
      </div>
      <input class="search-input" id="searchInput" placeholder="🔍 Search by name…" oninput="renderList()"/>
      <select class="filter-select" id="regionFilter" onchange="renderList()">
        <option value="">All Regions</option>
      </select>
      <select class="filter-select" id="statusFilter" onchange="renderList()">
        <option value="enabled" selected>Enabled</option>
        <option value="disabled">Disabled</option>
        <option value="any">Any</option>
      </select>
    </div>
    <div class="site-list" id="siteList"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel" id="rightPanel">
    <div class="empty-hint">← Select a site to edit<br>or click ＋ New Site</div>
  </div>

</div>

<!-- Duplicate Feed Modal -->
<div class="dup-overlay" id="dupOverlay" onclick="closeDupModal(event)">
  <div class="dup-box">
    <div class="dup-header">
      <h2 id="dupTitle">🔍 Find Duplicated Feed</h2>
      <button class="dup-close" onclick="closeDupOverlay()">✕</button>
    </div>
    <div class="dup-body" id="dupBody"></div>
    <div class="dup-footer">
      <span id="dupStats"></span>
      <span>Delete duplicates or edit to fix name/region</span>
    </div>
  </div>
</div>

<!-- Region datalist — auto-populated -->
<datalist id="regionOptions"></datalist>

<script src="common/common.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
