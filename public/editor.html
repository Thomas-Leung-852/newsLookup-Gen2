<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>News Sources Editor — newsLookup Gen2</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:       #0d0f12;
    --bg2:      #13161b;
    --bg3:      #1a1e26;
    --border:   #2a2f3d;
    --accent:   #4ade80;
    --accent2:  #22d3ee;
    --warn:     #fbbf24;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --danger:   #f87171;
    --success:  #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg2);
    flex-shrink: 0;
  }
  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent2);
  }
  .logo span { color: var(--muted); font-weight: 400; }
  .site-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  /* ── Layout ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Left Panel ── */
  .left-panel {
    width: 340px;
    min-width: 340px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--bg2);
    overflow: hidden;
  }

  .left-toolbar {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .btn-row { display: flex; gap: 7px; }

  /* buttons */
  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: #0f2a1a; }
  .btn.danger  { border-color: var(--border); color: var(--muted); }
  .btn.danger:hover  { border-color: var(--danger); color: var(--danger); }
  .btn.success { border-color: var(--accent); color: #0d0f12; background: var(--accent); }
  .btn.success:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* search + filter */
  .search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent2); }
  .search-input::placeholder { color: var(--muted); }

  select.filter-select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  select.filter-select:focus { border-color: var(--accent2); }
  select.filter-select option { background: var(--bg2); }

  /* site list */
  .site-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
  }
  .site-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s;
    border: 1px solid transparent;
  }
  .site-row:hover { background: var(--bg3); }
  .site-row.active {
    background: #0f2a1a;
    border-color: #1a4a2a;
  }
  .site-row .sname {
    flex: 1;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .site-row .sregion {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }
  .site-row .snew {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--warn);
    border: 1px solid var(--warn);
    border-radius: 3px;
    padding: 1px 4px;
  }

  /* ── Right Panel ── */
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 20px 24px;
    gap: 14px;
  }

  .right-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
  }

  .fields-area {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .field-group label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field-group input {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  .field-group input:focus { border-color: var(--accent2); }
  .field-group input::placeholder { color: var(--muted); }
  .field-group .hint {
    font-size: 11px;
    color: var(--muted);
  }

  /* test result badge */
  .test-result {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: none;
    overflow: hidden;
  }
  .test-result.ok      { border-color: var(--success); background: #0f2a1a; }
  .test-result.fail    { border-color: var(--danger);  background: #2a0f0f; }
  .test-result.warn    { border-color: var(--warn);    background: #2a1f00; }
  .test-status {
    padding: 8px 14px;
    font-weight: 600;
  }
  .test-result.ok   .test-status { color: var(--success); }
  .test-result.fail .test-status { color: var(--danger);  }
  .test-result.warn .test-status { color: var(--warn);    }
  .test-articles {
    border-top: 1px solid var(--border);
    max-height: 260px;
    overflow-y: auto;
  }
  .test-article-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 14px;
    border-bottom: 1px solid #1a1e26;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
  }
  .test-article-row:last-child { border-bottom: none; }
  .test-article-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    min-width: 22px;
    padding-top: 2px;
  }
  .test-article-row a {
    color: var(--text);
    text-decoration: none;
    line-height: 1.5;
    flex: 1;
  }
  .test-article-row a:hover { color: var(--accent2); text-decoration: underline; }
  .test-article-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    padding-top: 3px;
    min-width: 80px;
    text-align: right;
  }
  .test-article-date.stale { color: var(--danger); }
  .feed-updated {
    padding: 5px 14px 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    border-bottom: 1px solid var(--border);
  }
  .feed-updated.ok    { color: var(--accent); }
  .feed-updated.stale { color: var(--danger); }
  .feed-updated.unknown { color: var(--muted); }

  /* right action buttons */
  .right-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
    align-items: center;
  }
  .dirty-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--warn);
    border: 1px solid var(--warn);
    border-radius: 3px;
    padding: 2px 7px;
    display: none;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Left panel toggle (mobile) ── */
  .panel-toggle {
    display: none;
    background: none;
    border: 1px solid var(--border);
    color: var(--accent2);
    border-radius: 5px;
    padding: 4px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    body { overflow: auto; }

    header { padding: 10px 14px; gap: 8px; }
    .logo { font-size: 12px; }
    .site-count { font-size: 10px; }
    .panel-toggle { display: block; }

    .layout { flex-direction: column; overflow: visible; }

    .left-panel {
      width: 100%;
      min-width: unset;
      border-right: none;
      border-bottom: 1px solid var(--border);
      display: none;
      max-height: 60vh;
    }
    .left-panel.open { display: flex; }

    .left-toolbar { padding: 8px; gap: 6px; }
    .btn-row { flex-wrap: wrap; }
    .btn { padding: 6px 10px; font-size: 12px; }

    .search-input { font-size: 16px; }
    select.filter-select { font-size: 16px; }

    .right-panel {
      padding: 14px;
      gap: 12px;
      overflow-y: auto;
    }

    .field-group input { font-size: 16px; /* prevents iOS auto-zoom */ }

    .right-actions { flex-wrap: wrap; gap: 6px; }

    /* Duplicate modal */
    .dup-box { width: 96vw; max-width: 96vw; max-height: 85vh; }
    .dup-row { flex-wrap: wrap; gap: 6px; }
    .dup-region { min-width: unset; }
  }

  @media (max-width: 430px) {
    .logo { font-size: 11px; }
    .right-panel { padding: 10px; }
    .test-articles { max-height: 180px; }
  }

  /* empty state */
  .empty-hint {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: center;
    line-height: 2;
  }
  /* ── Duplicate modal ── */
  .dup-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 100;
    align-items: center; justify-content: center;
  }
  .dup-overlay.open { display: flex; }
  .dup-box {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; width: 680px; max-width: 95vw; max-height: 80vh;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .dup-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .dup-header h2 { font-family: 'IBM Plex Mono',monospace; font-size: 13px; color: var(--warn); font-weight: 500; }
  .dup-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .dup-close:hover { color: var(--danger); }
  .dup-body { overflow-y: auto; flex: 1; padding: 8px 0; }
  .dup-group {
    margin: 10px 14px; border: 1px solid var(--warn);
    border-radius: 7px; overflow: hidden;
  }
  .dup-group-header {
    background: #2a1f00; padding: 7px 14px;
    font-family: 'IBM Plex Mono',monospace; font-size: 11px; color: var(--warn);
    border-bottom: 1px solid var(--warn);
  }
  .dup-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    font-size: 13px; transition: background 0.1s;
  }
  .dup-row:last-child { border-bottom: none; }
  .dup-row:hover { background: var(--bg3); }
  .dup-name { flex: 1; font-weight: 500; }
  .dup-region { font-family: 'IBM Plex Mono',monospace; font-size: 10px; color: var(--muted); min-width: 80px; }
  .dup-del-btn {
    font-family: 'IBM Plex Mono',monospace; font-size: 11px;
    padding: 3px 10px; border-radius: 4px;
    border: 1px solid var(--border); background: none;
    color: var(--danger); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .dup-del-btn:hover { border-color: var(--danger); background: #2a0f0f; }
  .dup-edit-btn {
    font-family: 'IBM Plex Mono',monospace; font-size: 11px;
    padding: 3px 10px; border-radius: 4px;
    border: 1px solid var(--border); background: none;
    color: var(--accent2); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .dup-edit-btn:hover { border-color: var(--accent2); background: #0a1a22; }
  .dup-footer {
    padding: 10px 18px; border-top: 1px solid var(--border);
    font-family: 'IBM Plex Mono',monospace; font-size: 11px; color: var(--muted);
    flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
  }
</style>
</head>
<body>

<header>
  <div class="logo">news<span>Lookup</span> Gen2 — RSS Site Editor</div>
  <button class="panel-toggle" id="panelToggle" onclick="togglePanel()" title="Toggle site list">☰ Sites</button>
  <div class="site-count" id="siteCount">Loading...</div>
</header>

<div class="layout">

  <!-- ── LEFT PANEL ── -->
  <div class="left-panel">
    <div class="left-toolbar">
      <div class="btn-row">
        <button class="btn primary" onclick="newSite()">＋ New Site</button>
        <button class="btn danger"  onclick="deleteSite()" id="btnDelete" disabled>✕ Delete</button>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="findDuplicates()" style="flex:1;border-color:var(--warn);color:var(--warn)">🔍 Find Duplicated Feed</button>
      </div>
      <input class="search-input" id="searchInput" placeholder="🔍 Search by name…" oninput="renderList()"/>
      <select class="filter-select" id="regionFilter" onchange="renderList()">
        <option value="">All Regions</option>
      </select>
    </div>
    <div class="site-list" id="siteList"></div>
  </div>

  <!-- ── RIGHT PANEL ── -->
  <div class="right-panel" id="rightPanel">
    <div class="empty-hint">← Select a site to edit<br>or click ＋ New Site</div>
  </div>

</div>

<!-- ── Duplicate Feed Modal ── -->
<div class="dup-overlay" id="dupOverlay" onclick="closeDupModal(event)">
  <div class="dup-box">
    <div class="dup-header">
      <h2 id="dupTitle">🔍 Find Duplicated Feed</h2>
      <button class="dup-close" onclick="closeDupOverlay()">✕</button>
    </div>
    <div class="dup-body" id="dupBody"></div>
    <div class="dup-footer">
      <span id="dupStats"></span>
      <span>Delete duplicates or edit to fix name/region</span>
    </div>
  </div>
</div>

<!-- Region datalist — auto-populated -->
<datalist id="regionOptions"></datalist>

<script>
let sites       = [];       // full array from server
let filtered    = [];       // currently shown in list
let activeIdx   = -1;       // index in `sites` of selected row (-1 = new)
let isDirty     = false;    // unsaved changes in right panel

// ── Find Duplicates ──────────────────────────────────────────────────────────
function findDuplicates() {
  // group sites by normalised RSS URL
  const urlMap = {};
  sites.forEach((site, idx) => {
    const key = site.rss.trim().toLowerCase().replace(/\/+$/, ''); // normalise trailing slash
    if (!urlMap[key]) urlMap[key] = [];
    urlMap[key].push({ site, idx });
  });

  // only keep groups with more than one entry
  const dupGroups = Object.entries(urlMap).filter(([, group]) => group.length > 1);

  document.getElementById('dupOverlay').classList.add('open');

  if (!dupGroups.length) {
    document.getElementById('dupTitle').textContent = '✅ No Duplicates Found';
    document.getElementById('dupBody').innerHTML =
      '<div style="padding:40px;text-align:center;color:var(--accent);font-family:IBM Plex Mono,monospace;font-size:13px">' +
      '✅ All RSS feed URLs are unique.<br><br>' +
      '<span style="font-size:11px;color:var(--muted)">Checked ' + sites.length + ' sites — no duplicates detected.</span></div>';
    document.getElementById('dupStats').textContent = sites.length + ' sites checked · 0 duplicates';
    return;
  }

  const totalDups = dupGroups.reduce((sum, [, g]) => sum + g.length, 0);
  document.getElementById('dupTitle').textContent = '⚠️ Found ' + dupGroups.length + ' duplicated URL' + (dupGroups.length > 1 ? 's' : '');
  document.getElementById('dupStats').textContent = dupGroups.length + ' duplicate group' + (dupGroups.length > 1 ? 's' : '') + ' · ' + totalDups + ' affected sites';

  const html = dupGroups.map(([url, group]) => {
    const rows = group.map(({ site, idx }) =>
      '<div class="dup-row">' +
      '<span class="dup-name">' + esc(site.name) + '</span>' +
      '<span class="dup-region">' + esc(site.region) + '</span>' +
      '<button class="dup-edit-btn" onclick="dupEdit(' + idx + ')">✎ Edit</button>' +
      '<button class="dup-del-btn"  onclick="dupDelete(' + idx + ')">✕ Delete</button>' +
      '</div>'
    ).join('');
    return '<div class="dup-group">' +
      '<div class="dup-group-header">🔗 ' + esc(url) + '</div>' +
      rows + '</div>';
  }).join('');

  document.getElementById('dupBody').innerHTML = html;
}

async function dupDelete(realIdx) {
  const site = sites[realIdx];
  if (!confirm('Delete "' + site.name + '"?\n\nThis will remove it from rss-sites.json immediately.')) return;
  sites.splice(realIdx, 1);
  await saveToServer();
  renderList();
  updateCount();
  showToast('✅ "' + site.name + '" deleted.');
  // refresh the duplicate list
  findDuplicates();
}

function dupEdit(realIdx) {
  closeDupOverlay();
  selectSite(realIdx);
}

function closeDupModal(e) {
  if (e.target === document.getElementById('dupOverlay')) closeDupOverlay();
}
function closeDupOverlay() {
  document.getElementById('dupOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDupOverlay(); });

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Fetch & init ─────────────────────────────────────────────────────────────
async function loadSites() {
  const res  = await fetch('/api/sites');
  sites = await res.json();
  refreshRegionOptions();
  renderList();
  updateCount();
}

function refreshRegionOptions() {
  const regions = [...new Set(sites.map(s => s.region))].sort();
  // update datalist
  const dl = document.getElementById('regionOptions');
  dl.innerHTML = regions.map(r => `<option value="${r}">`).join('');
  // update filter dropdown (keep current selection)
  const sel = document.getElementById('regionFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All Regions</option>' +
    regions.map(r => `<option value="${r}"${r===cur?' selected':''}>${r}</option>`).join('');
}

function updateCount() {
  document.getElementById('siteCount').textContent = `${sites.length} site${sites.length !== 1 ? 's' : ''}`;
}

// ── Render left list ──────────────────────────────────────────────────────────
function renderList() {
  const q      = document.getElementById('searchInput').value.toLowerCase();
  const region = document.getElementById('regionFilter').value;

  filtered = sites.filter(s =>
    (!region || s.region === region) &&
    (!q      || s.name.toLowerCase().includes(q))
  );

  const list = document.getElementById('siteList');
  if (!filtered.length) {
    list.innerHTML = '<div style="padding:14px;color:var(--muted);font-size:12px;font-family:IBM Plex Mono,monospace">No sites found</div>';
    return;
  }

  list.innerHTML = filtered.map((s, i) => {
    const realIdx = sites.indexOf(s);
    const isActive = realIdx === activeIdx;
    return `<div class="site-row${isActive ? ' active' : ''}" onclick="selectSite(${realIdx})">
      <span class="sname">${esc(s.name)}</span>
      <span class="sregion">${esc(s.region)}</span>
    </div>`;
  }).join('');
}

// ── Select a site ─────────────────────────────────────────────────────────────
function selectSite(realIdx) {
  if (isDirty && !confirmLeave()) return;
  activeIdx = realIdx;
  isDirty   = false;
  renderList();
  renderForm(sites[realIdx]);
  document.getElementById('btnDelete').disabled = false;
}

// ── New Site ──────────────────────────────────────────────────────────────────
function newSite() {
  if (isDirty && !confirmLeave()) return;
  activeIdx = -1;
  isDirty   = false;
  renderList();
  renderForm(null);
  document.getElementById('btnDelete').disabled = true;
}

// ── Delete Site ───────────────────────────────────────────────────────────────
async function deleteSite() {
  if (activeIdx < 0) return;
  const site = sites[activeIdx];
  if (!confirm(`Delete "${site.name}"?\n\nThis will remove it from rss-sites.json immediately.`)) return;

  sites.splice(activeIdx, 1);
  await saveToServer();
  activeIdx = -1;
  isDirty   = false;
  renderList();
  showEmpty();
  document.getElementById('btnDelete').disabled = true;
}

// ── Render right form ─────────────────────────────────────────────────────────
function renderForm(site) {
  const panel = document.getElementById('rightPanel');
  const v = site || { name:'', rss:'', region:'' };

  panel.innerHTML = `
    <div class="right-title">${site ? 'Edit Site' : 'New Site'}</div>

    <div class="fields-area">
      <div class="field-group">
        <label>Display Name *</label>
        <input id="f_name" value="${esc(v.name)}" placeholder="e.g. SCMP" oninput="markDirty()"/>
      </div>
      <div class="field-group">
        <label>RSS Feed URL *</label>
        <input id="f_rss" value="${esc(v.rss)}" placeholder="https://example.com/rss.xml" oninput="markDirty()"/>
        <span class="hint">The RSS or Atom feed URL used for fetching articles.</span>
      </div>
      <div class="field-group">
        <label>Region *</label>
        <input id="f_region" value="${esc(v.region)}" placeholder="e.g. HK, Asia, International, Tech"
          list="regionOptions" autocomplete="off" oninput="markDirty()"/>
        <span class="hint">Type to see existing regions, or enter a new one.</span>
      </div>

      <div id="testResult" class="test-result"></div>
    </div>

    <div class="right-actions">
      <button class="btn success" onclick="saveSite()">💾 Save</button>
      <button class="btn"         onclick="clearFields()">⌫ Clear</button>
      <button class="btn"         onclick="testRSS()">🔗 Test RSS</button>
      <span class="dirty-badge" id="dirtyBadge">● unsaved</span>
    </div>`;
}

function showEmpty() {
  document.getElementById('rightPanel').innerHTML =
    '<div class="empty-hint">← Select a site to edit<br>or click ＋ New Site</div>';
}

// ── Dirty tracking ────────────────────────────────────────────────────────────
function markDirty() {
  isDirty = true;
  const b = document.getElementById('dirtyBadge');
  if (b) b.style.display = 'inline';
}

function confirmLeave() {
  return confirm('You have unsaved changes.\n\nAre you sure you want to leave without saving?');
}

// Browser tab close guard
window.addEventListener('beforeunload', e => {
  if (isDirty) { e.preventDefault(); e.returnValue = ''; }
});

// ── Clear fields ──────────────────────────────────────────────────────────────
function clearFields() {
  ['f_name','f_rss','f_region'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const tr = document.getElementById('testResult');
  if (tr) { tr.style.display = 'none'; tr.textContent = ''; }
  markDirty();
}

// ── Save site ─────────────────────────────────────────────────────────────────
async function saveSite() {
  const name   = (document.getElementById('f_name')?.value   || '').trim();
  const rss    = (document.getElementById('f_rss')?.value    || '').trim();
  const region = (document.getElementById('f_region')?.value || '').trim();

  if (!name)   { alert('⚠️ Display Name is required.'); return; }
  if (!rss)    { alert('⚠️ RSS Feed URL is required.'); return; }
  if (!region) { alert('⚠️ Region is required.'); return; }

  const record = { name, rss, region };

  if (activeIdx >= 0) {
    // update existing
    sites[activeIdx] = record;
  } else {
    // new site — check for duplicate name
    if (sites.find(s => s.name.toLowerCase() === name.toLowerCase())) {
      alert(`⚠️ A site named "${name}" already exists.`); return;
    }
    sites.push(record);
  }

  await saveToServer();
  // find new index after sort
  activeIdx = sites.findIndex(s => s.name === name);
  isDirty = false;
  const b = document.getElementById('dirtyBadge');
  if (b) b.style.display = 'none';
  refreshRegionOptions();
  renderList();
  updateCount();
  showToast(`✅ "${name}" saved.`);
}

// ── Write to server ───────────────────────────────────────────────────────────
async function saveToServer() {
  const res = await fetch('/api/sites', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(sites),
  });
  if (!res.ok) {
    const err = await res.json();
    alert('❌ Save failed: ' + err.error);
    throw new Error(err.error);
  }
  // reload from server (server sorts it)
  const fresh = await fetch('/api/sites');
  sites = await fresh.json();
}

// ── Test RSS ──────────────────────────────────────────────────────────────────
async function testRSS() {
  const rss = (document.getElementById('f_rss')?.value || '').trim();
  const tr  = document.getElementById('testResult');
  if (!rss) { alert('⚠️ Enter an RSS URL first.'); return; }

  tr.style.display = 'block';
  tr.className     = 'test-result';
  tr.innerHTML     = '<div class="test-status">⏳ Testing…</div>';

  try {
    const res  = await fetch(`/api/test-rss?url=${encodeURIComponent(rss)}`);
    const data = await res.json();

    let statusHtml = '';
    if (data.status === 200) {
      tr.className = 'test-result ok';
      statusHtml   = `✅ ${data.status} OK — Feed is reachable! (${data.articles.length} articles fetched)`;
    } else if (data.status === 403) {
      tr.className = 'test-result warn';
      statusHtml   = `⚠️ ${data.status} Forbidden — Site blocks bots. May still work in the app.`;
    } else if (data.status === 404) {
      tr.className = 'test-result fail';
      statusHtml   = `❌ ${data.status} Not Found — Check the RSS URL.`;
    } else if (data.status === 0) {
      tr.className = 'test-result fail';
      statusHtml   = `❌ Connection error — ${data.statusText}`;
    } else {
      tr.className = 'test-result warn';
      statusHtml   = `⚠️ ${data.status} ${data.statusText}`;
    }

    // helper: format a date string into a short label + staleness flag
    function fmtDate(raw) {
      if (!raw) return { label: '', stale: false };
      const d = new Date(raw);
      if (isNaN(d)) return { label: String(raw).slice(0, 16), stale: false };
      const ageMs    = Date.now() - d.getTime();
      const ageDays  = Math.floor(ageMs / 86400000);
      const stale    = ageDays > 90;   // flag anything older than 90 days
      let label;
      if (ageDays === 0)      label = 'today';
      else if (ageDays === 1) label = 'yesterday';
      else if (ageDays < 30)  label = ageDays + 'd ago';
      else if (ageDays < 365) label = Math.floor(ageDays/30) + 'mo ago';
      else                    label = Math.floor(ageDays/365) + 'yr ago ⚠️';
      return { label, stale };
    }

    // feed-level last update banner
    let feedHtml = '';
    if (data.feedUpdated) {
      const { label, stale } = fmtDate(data.feedUpdated);
      feedHtml = `<div class="feed-updated ${stale ? 'stale' : 'ok'}">
        ${stale ? '⚠️' : '🕐'} Feed last updated: ${esc(label)} &nbsp;·&nbsp; <span style="color:var(--muted)">${esc(String(data.feedUpdated).slice(0,25))}</span>
      </div>`;
    } else {
      feedHtml = `<div class="feed-updated unknown">🕐 Feed update date: not provided by this feed</div>`;
    }

    // build articles list with per-article dates
    let articlesHtml = '';
    if (data.articles && data.articles.length) {
      const rows = data.articles.map((a, i) => {
        const { label, stale } = fmtDate(a.pubDate);
        const dateCell = label
          ? `<span class="test-article-date ${stale ? 'stale' : ''}">${esc(label)}</span>`
          : '';
        return `<div class="test-article-row">
          <span class="test-article-num">${i + 1}.</span>
          <a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a>
          ${dateCell}
        </div>`;
      }).join('');
      articlesHtml = `<div class="test-articles">${rows}</div>`;
    }

    tr.innerHTML = `<div class="test-status">${statusHtml}</div>${feedHtml}${articlesHtml}`;

  } catch (err) {
    tr.className = 'test-result fail';
    tr.innerHTML = `<div class="test-status">❌ Request failed — ${esc(err.message)}</div>`;
  }
}

// ── Toast notification ────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `
    position:fixed;bottom:24px;right:24px;
    background:#0f2a1a;border:1px solid var(--accent);color:var(--accent);
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    padding:10px 18px;border-radius:7px;
    animation:fadeUp 0.2s ease;z-index:999;`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ── Util ──────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Panel Toggle (mobile) ─────────────────────────────────────────────────────
function togglePanel() {
  const panel = document.querySelector('.left-panel');
  const btn   = document.getElementById('panelToggle');
  const open  = panel.classList.toggle('open');
  btn.textContent = open ? '✕ Sites' : '☰ Sites';
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadSites();
</script>
</body>
</html>
